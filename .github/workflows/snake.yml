name: Generate Full Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:

    runs-on: ubuntu-latest

    steps:

      - name: Generate Full Contribution Snake

        uses: Platane/snk@v3

        with:
          github_user_name: ${{ github.repository_owner }}

          github_token: ${{ secrets.GITHUB_TOKEN }}

          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2300E5FF&color_dots=%23020617,%230B2533,%23005673,%230089A8,%2300E5FF

            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2300E5FF


      - name: Deploy Snake

        uses: crazy-max/ghaction-github-pages@v4

        with:
          target_branch: output
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
