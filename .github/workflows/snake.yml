name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    name: Generate Snake Animation

    permissions:
      contents: write

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      - name: Generate Contribution Snake
        uses: Platane/snk/svg-only@v3

        with:
          github_user_name: Egbyz666

          outputs: |

            dist/github-contribution-grid-snake.svg?color_snake=%2300E5FF&color_dots=%23020617,%230B2533,%23004466,%23007A99,%2300E5FF

            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2300E5FF


      - name: Deploy Snake Animation

        uses: crazy-max/ghaction-github-pages@v4

        with:
          target_branch: output
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
